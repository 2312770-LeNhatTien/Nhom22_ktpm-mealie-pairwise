ospace">showNutrition</text><text x="905" y="898" font-size="20" fill="#1e7b3a" font-weight="bold" text-anchor="middle">←</text><text x="925" y="898" font-size="16" fill="#1b2433" font-weight="normal" text-anchor="start" font-family="'DejaVu Sans Mono',monospace">recipeShowNutrition</text><text x="736" y="932" font-size="16" fill="#1b2433" font-weight="normal" text-anchor="start" font-family="'DejaVu Sans Mono',monospace">showAssets</text><text x="905" y="932" font-size="20" fill="#1e7b3a" font-weight="bold" text-anchor="middle">←</text><text x="925" y="932" font-size="16" fill="#1b2433" font-weight="normal" text-anchor="start" font-family="'DejaVu Sans Mono',monospace">recipeShowAssets</text><text x="736" y="966" font-size="16" fill="#1b2433" font-weight="normal" text-anchor="start" font-family="'DejaVu Sans Mono',monospace">landscapeView</text><text x="905" y="966" font-size="20" fill="#1e7b3a" font-weight="bold" text-anchor="middle">←</text><text x="925" y="966" font-size="16" fill="#1b2433" font-weight="normal" text-anchor="start" font-family="'DejaVu Sans Mono',monospace">recipeLandscapeView</text><text x="736" y="1000" font-size="16" fill="#1b2433" font-weight="normal" text-anchor="start" font-family="'DejaVu Sans Mono',monospace">disableComments</text><text x="905" y="1000" font-size="20" fill="#1e7b3a" font-weight="bold" text-anchor="middle">←</text><text x="925" y="1000" font-size="16" fill="#1b2433" font-weight="normal" text-anchor="start" font-family="'DejaVu Sans Mono',monospace">recipeDisableComments</text><path d="M684,856.0 H716" fill="none" stroke="#1e7b3a" stroke-width="3.5" marker-end="url(#g)"/><rect x="40" y="940" width="640" height="100" rx="14" fill="#e3f4e8" stroke="#1e7b3a" stroke-width="2.5"/><text x="60" y="978" font-size="21" fill="#1e7b3a" font-weight="bold" text-anchor="start">Test kiểm tra: 5 giá trị trong công thức</text><text x="60" y="1010" font-size="21" fill="#1e7b3a" font-weight="bold" text-anchor="start">phải bằng 5 công tắc đã đặt ở bước 1  ✓</text></svg>