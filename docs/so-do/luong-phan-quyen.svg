<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" font-family="'DejaVu Sans',Arial,sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#44506a"/></marker><marker id="g" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#1e7b3a"/></marker><marker id="r" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#b42318"/></marker></defs><rect width="1200" height="1050" fill="#ffffff"/><text x="600.0" y="48" font-size="32" fill="#1b2433" font-weight="bold" text-anchor="middle">Luồng 3: Phân quyền người dùng</text><text x="600.0" y="82" font-size="19" fill="#5b6575" font-weight="normal" text-anchor="middle">Mealie hỏi một câu: "Bạn là admin, hay có cờ cho việc này?"</text><rect x="40" y="120" width="620" height="112" rx="14" fill="#e8f0fe" stroke="#1f4e9c" stroke-width="2.5"/><circle cx="80" cy="176.0" r="25" fill="#1f4e9c"/><text x="80" y="185.0" font-size="26" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="124" y="156.0" font-size="23" fill="#1b2433" font-weight="bold" text-anchor="start">Admin tạo user mới</text><text x="124" y="186.0" font-size="23" fill="#1b2433" font-weight="bold" text-anchor="start">và tick các cờ quyền</text><text x="124" y="216" font-size="17" fill="#5b6575" font-weight="normal" text-anchor="start" font-family="'DejaVu Sans Mono',monospace">POST /api/admin/users</text><rect x="40" y="290" width="620" height="112" rx="14" fill="#e8f0fe" stroke="#1f4e9c" stroke-width="2.5"/><circle cx="80" cy="346.0" r="25" fill="#1f4e9c"/><text x="80" y="355.0" font-size="26" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="124" y="326.0" font-size="23" fill="#1b2433" font-weight="bold" text-anchor="start">User đăng nhập,</text><text x="124" y="356.0" font-size="23" fill="#1b2433" font-weight="bold" text-anchor="start">nhận token (như một tấm vé)</text><text x="124" y="386" font-size="17" fill="#5b6575" font-weight="normal" text-anchor="start" font-family="'DejaVu Sans Mono',monospace">POST /api/auth/token</text><rect x="40" y="460" width="620" height="112" rx="14" fill="#e8f0fe" stroke="#1f4e9c" stroke-width="2.5"/><circle cx="80" cy="516.0" r="25" fill="#1f4e9c"/><text x="80" y="525.0" font-size="26" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="124" y="496.0" font-size="23" fill="#1b2433" font-weight="bold" text-anchor="start">User làm một việc,</text><text x="124" y="526.0" font-size="23" fill="#1b2433" font-weight="bold" text-anchor="start">đưa token kèm theo</text><text x="124" y="556" font-size="17" fill="#5b6575" font-weight="normal" text-anchor="start">ví dụ: tạo category</text><path d="M350.0,235 V284" fill="none" stroke="#44506a" stroke-width="3.5" marker-end="url(#a)"/><path d="M350.0,405 V454" fill="none" stroke="#44506a" stroke-width="3.5" marker-end="url(#a)"/><path d="M350.0,575 V627" fill="none" stroke="#44506a" stroke-width="3.5" marker-end="url(#a)"/><polygon points="350,665 600,760 350,855 100,760" fill="#fff6d6" stroke="#b7791f" stroke-width="3"/><text x="350" y="742" font-size="22" fill="#1b2433" font-weight="bold" text-anchor="middle">Là admin,</text><text x="350" y="770" font-size="22" fill="#1b2433" font-weight="bold" text-anchor="middle">hoặc có cờ của</text><text x="350" y="798" font-size="22" fill="#1b2433" font-weight="bold" text-anchor="middle">việc này?</text><circle cx="80" cy="690" r="25" fill="#b7791f"/><text x="80" y="699" font-size="26" fill="#fff" font-weight="bold" text-anchor="middle">4</text><path d="M600,760 H760" fill="none" stroke="#1e7b3a" stroke-width="3.5" marker-end="url(#g)"/><text x="640" y="746" font-size="24" fill="#1e7b3a" font-weight="bold" text-anchor="start">Có</text><rect x="764" y="700" width="370" height="120" rx="14" fill="#e3f4e8" stroke="#1e7b3a" stroke-width="2.5"/><text x="949" y="746" font-size="30" fill="#1e7b3a" font-weight="bold" text-anchor="middle">200 / 201</text><text x="949" y="784" font-size="22" fill="#1e7b3a" font-weight="normal" text-anchor="middle">làm được</text><path d="M350,855 V925" fill="none" stroke="#b42318" stroke-width="3.5" marker-end="url(#r)"/><text x="376" y="898" font-size="24" fill="#b42318" font-weight="bold" text-anchor="start">Không</text><rect x="100" y="928" width="500" height="100" rx="14" fill="#fde8e6" stroke="#b42318" stroke-width="2.5"/><text x="350" y="972" font-size="30" fill="#b42318" font-weight="bold" text-anchor="middle">403</text><text x="350" y="1008" font-size="22" fill="#b42318" font-weight="normal" text-anchor="middle">không đủ quyền</text><rect x="720" y="120" width="440" height="420" rx="14" fill="#f6f8fb" stroke="#9aa5b8" stroke-width="2.5"/><text x="940" y="156" font-size="21" fill="#1b2433" font-weight="bold" text-anchor="middle">Việc nào cần cờ nào?</text><text x="738" y="204" font-size="16" fill="#1b2433" font-weight="normal" text-anchor="start">tạo category</text><text x="738" y="226" font-size="15" fill="#1f4e9c" font-weight="bold" text-anchor="start" font-family="'DejaVu Sans Mono',monospace">→ canOrganize</text><text x="738" y="254" font-size="16" fill="#1b2433" font-weight="normal" text-anchor="start">lưu cấu hình household</text><text x="738" y="276" font-size="15" fill="#1f4e9c" font-weight="bold" text-anchor="start" font-family="'DejaVu Sans Mono',monospace">→ canManageHousehold</text><text x="738" y="304" font-size="16" fill="#1b2433" font-weight="normal" text-anchor="start">xem thành viên</text><text x="738" y="326" font-size="15" fill="#1f4e9c" font-weight="bold" text-anchor="start" font-family="'DejaVu Sans Mono',monospace">→ canManage</text><text x="738" y="354" font-size="16" fill="#1b2433" font-weight="normal" text-anchor="start">đặt quyền thành viên</text><text x="738" y="376" font-size="15" fill="#1f4e9c" font-weight="bold" text-anchor="start" font-family="'DejaVu Sans Mono',monospace">→ canManage</text><text x="738" y="404" font-size="16" fill="#1b2433" font-weight="normal" text-anchor="start">tạo lời mời</text><text x="738" y="426" font-size="15" fill="#1f4e9c" font-weight="bold" text-anchor="start" font-family="'DejaVu Sans Mono',monospace">→ canInvite</text><text x="738" y="454" font-size="16" fill="#1b2433" font-weight="normal" text-anchor="start">danh sách user (admin)</text><text x="738" y="476" font-size="15" fill="#1f4e9c" font-weight="bold" text-anchor="start">→ chỉ cần admin</text><rect x="720" y="560" width="440" height="90" rx="14" fill="#fff6d6" stroke="#b7791f" stroke-width="2.5"/><text x="740" y="596" font-size="18" fill="#1b2433" font-weight="bold" text-anchor="start">Admin = tự có đủ mọi cờ:</text><text x="740" y="624" font-size="17" fill="#1b2433" font-weight="normal" text-anchor="start">lưu admin=true thì Mealie bật cả 4 cờ</text></svg>