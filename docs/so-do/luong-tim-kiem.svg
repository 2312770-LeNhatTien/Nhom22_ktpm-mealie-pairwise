<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1265" viewBox="0 0 1200 1265" font-family="'DejaVu Sans',Arial,sans-serif"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#44506a"/></marker><marker id="g" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#1e7b3a"/></marker><marker id="r" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#b42318"/></marker></defs><rect width="1200" height="1265" fill="#ffffff"/><text x="600.0" y="48" font-size="32" fill="#1b2433" font-weight="bold" text-anchor="middle">Luồng 2: Tìm kiếm và lọc công thức</text><text x="600.0" y="82" font-size="19" fill="#5b6575" font-weight="normal" text-anchor="middle">Mealie lọc dần dần, giống như đổ qua nhiều cái rây (ví dụ lấy từ dữ liệu mẫu của nhóm)</text><rect x="40" y="110" width="1120" height="150" rx="14" fill="#e8f0fe" stroke="#1f4e9c" stroke-width="2.5"/><text x="60" y="148" font-size="22" fill="#1f4e9c" font-weight="bold" text-anchor="start">Bạn gửi yêu cầu:</text><text x="300" y="148" font-size="19" fill="#5b6575" font-weight="normal" text-anchor="start" font-family="'DejaVu Sans Mono',monospace">GET /api/recipes?...</text><rect x="60" y="175" width="135" height="52" rx="26" fill="#ffffff" stroke="#1f4e9c" stroke-width="2.5"/><text x="127.5" y="210" font-size="21" fill="#1b2433" font-weight="normal" text-anchor="middle">từ khóa</text><rect x="211" y="175" width="148" height="52" rx="26" fill="#ffffff" stroke="#1f4e9c" stroke-width="2.5"/><text x="285.0" y="210" font-size="21" fill="#1b2433" font-weight="normal" text-anchor="middle">category</text><rect x="375" y="175" width="83" height="52" rx="26" fill="#ffffff" stroke="#1f4e9c" stroke-width="2.5"/><text x="416.5" y="210" font-size="21" fill="#1b2433" font-weight="normal" text-anchor="middle">tag</text><rect x="474" y="175" width="135" height="52" rx="26" fill="#ffffff" stroke="#1f4e9c" stroke-width="2.5"/><text x="541.5" y="210" font-size="21" fill="#1b2433" font-weight="normal" text-anchor="middle">sắp xếp</text><rect x="625" y="175" width="226" height="52" rx="26" fill="#ffffff" stroke="#1f4e9c" stroke-width="2.5"/><text x="738.0" y="210" font-size="21" fill="#1b2433" font-weight="normal" text-anchor="middle">số món / trang</text><path d="M600,262 V300" fill="none" stroke="#44506a" stroke-width="3.5" marker-end="url(#a)"/><rect x="100.0" y="304" width="1000" height="92" rx="12" fill="#c9d7f2" stroke="#1f4e9c" stroke-width="2.5"/><text x="600" y="344" font-size="28" fill="#1b2433" font-weight="bold" text-anchor="middle">12 món</text><text x="600" y="376" font-size="18" fill="#1b2433" font-weight="normal" text-anchor="middle">Tất cả công thức có sẵn</text><path d="M600,399 V432" fill="none" stroke="#44506a" stroke-width="3.5" marker-end="url(#a)"/><rect x="300.0" y="434" width="600" height="92" rx="12" fill="#a9c2ee" stroke="#1f4e9c" stroke-width="2.5"/><text x="600" y="474" font-size="28" fill="#1b2433" font-weight="bold" text-anchor="middle">còn 5 món</text><text x="600" y="506" font-size="18" fill="#1b2433" font-weight="normal" text-anchor="middle">Giữ lại món thuộc category đã chọn</text><path d="M600,529 V562" fill="none" stroke="#44506a" stroke-width="3.5" marker-end="url(#a)"/><rect x="390.0" y="564" width="420" height="92" rx="12" fill="#8aaee8" stroke="#1f4e9c" stroke-width="2.5"/><text x="600" y="604" font-size="28" fill="#1b2433" font-weight="bold" text-anchor="middle">còn 2 món</text><text x="600" y="636" font-size="18" fill="#1b2433" font-weight="normal" text-anchor="middle">Giữ lại món có thêm tag đã chọn</text><path d="M600,659 V692" fill="none" stroke="#44506a" stroke-width="3.5" marker-end="url(#a)"/><rect x="300" y="694" width="600" height="90" rx="14" fill="#e5ecfa" stroke="#1f4e9c" stroke-width="2.5"/><text x="600" y="732" font-size="23" fill="#1b2433" font-weight="bold" text-anchor="middle">Sắp xếp theo orderBy</text><text x="600" y="764" font-size="18" fill="#5b6575" font-weight="normal" text-anchor="middle">tăng dần hoặc giảm dần (orderDirection)</text><path d="M600,787 V818" fill="none" stroke="#44506a" stroke-width="3.5" marker-end="url(#a)"/><rect x="300" y="822" width="600" height="90" rx="14" fill="#e5ecfa" stroke="#1f4e9c" stroke-width="2.5"/><text x="600" y="860" font-size="23" fill="#1b2433" font-weight="bold" text-anchor="middle">Cắt thành trang</text><text x="600" y="892" font-size="18" fill="#5b6575" font-weight="normal" text-anchor="middle">mỗi trang perPage món, lấy trang page</text><path d="M600,915 V946" fill="none" stroke="#44506a" stroke-width="3.5" marker-end="url(#a)"/><rect x="40" y="950" width="1120" height="110" rx="14" fill="#e3f4e8" stroke="#1e7b3a" stroke-width="2.5"/><text x="60" y="990" font-size="22" fill="#1e7b3a" font-weight="bold" text-anchor="start">Mealie trả kết quả (JSON):</text><text x="60" y="1030" font-size="20" fill="#1b2433" font-weight="normal" text-anchor="start">items (danh sách món) · total · page · per_page · total_pages</text><rect x="40" y="1085" width="540" height="150" rx="14" fill="#fff6d6" stroke="#b7791f" stroke-width="2.5"/><text x="60" y="1119" font-size="21" fill="#b7791f" font-weight="bold" text-anchor="start">Ghi nhớ</text><text x="60" y="1151" font-size="17" fill="#1b2433" font-weight="normal" text-anchor="start">requireAllCategories = true:</text><text x="60" y="1175" font-size="17" fill="#1b2433" font-weight="normal" text-anchor="start">món phải có ĐỦ mọi category chọn</text><text x="60" y="1203" font-size="17" fill="#1b2433" font-weight="normal" text-anchor="start">= false: có MỘT trong số đó là được</text><rect x="620" y="1085" width="540" height="150" rx="14" fill="#fde8e6" stroke="#b42318" stroke-width="2.5"/><text x="640" y="1119" font-size="21" fill="#b42318" font-weight="bold" text-anchor="start">Cẩn thận</text><text x="640" y="1151" font-size="17" fill="#1b2433" font-weight="normal" text-anchor="start">orderBy=random mà thiếu paginationSeed</text><text x="640" y="1175" font-size="17" fill="#1b2433" font-weight="normal" text-anchor="start">→ bị từ chối, lỗi 422</text><text x="640" y="1203" font-size="17" fill="#1b2433" font-weight="normal" text-anchor="start">Viết per_page trên URL → bị bỏ qua lặng lẽ</text></svg>